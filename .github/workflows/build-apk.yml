name: Build Android APK

# 合并到 main 就出一个包,发到 Releases。也可以在 Actions 页手动点。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 出包之前先跑一遍单元测试。测试红了就不该有包 ——
      # 装上去才发现校准算错了,比构建失败难查得多。
      - name: 单元测试
        run: gradle test --no-daemon --stacktrace

      - name: Build the APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          # 版本号在 shell 里算。不要用 Actions 表达式做加法 ——
          # 它的语法里没有算术运算符,那样写整个 workflow 文件会解析失败:
          # run 建出来 0 秒就红,名字显示成文件路径而不是 workflow 的 name,
          # 连一个 job 都不会创建。
          #
          # 连带的一个坑:这段注释也不能举那个错误写法当例子。Actions 会对
          # 整个 run 块做表达式替换,不管那串东西在 shell 里是不是注释。
          #
          # 偏移量要和 app/build.gradle.kts 里的 codeOffset 保持一致。
          echo "APP_VERSION=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

          # 输出目录建在仓库根目录。以前这里踩过一次:先 cd 再 mkdir,
          # 目录建到了子目录里,而复制目标指向根目录,Gradle 显示成功但 job 失败。
          mkdir -p "$GITHUB_WORKSPACE/out"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ledger.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/ledger.jks"
            echo "Signing with the permanent key."
            gradle assembleRelease --no-daemon --stacktrace
            SRC_DIR=app/build/outputs/apk/release
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found — falling back to a debug key."
            echo "::warning::Debug keys differ on every run, so this build cannot be installed"
            echo "::warning::over an existing copy without uninstalling first (which erases data)."
            gradle assembleDebug --no-daemon --stacktrace
            SRC_DIR=app/build/outputs/apk/debug
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

          echo "Looking for the APK in $SRC_DIR"
          ls -la "$SRC_DIR" || true

          # 按文件名搜索,不要写死 —— 未签名时文件名会带 -unsigned 后缀
          APK=$(find "$SRC_DIR" -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced in $SRC_DIR"
            exit 1
          fi
          case "$APK" in
            *unsigned*)
              echo "::error::The APK came out unsigned. Check that all four keystore secrets are set."
              exit 1 ;;
          esac

          # 食物库是靠一个 Copy 任务从仓库根目录搬进 assets 的。这条链断了的话
          # 应用照样能装能用,只是搜不到任何食物 —— 要装到手机上才会发现。
          # 发布之前确认它在包里。
          if ! unzip -l "$APK" | grep -q 'assets/foods.json'; then
            echo "::error::APK 里没有 assets/foods.json,食物库没打进去,不发布这个包。"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/out/calorease.apk"
          echo "Copied $APK"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Attach it to a release
        uses: softprops/action-gh-release@v2
        with:
          # APP_VERSION 是上一步在 shell 里算好写进 $GITHUB_ENV 的,
          # 和 versionCode、versionName 是同一个数。
          tag_name: v${{ env.APP_VERSION }}
          name: Calorease v${{ env.APP_VERSION }}
          body: |
            点下方的 **calorease.apk** 安装。

            签名状态:`${{ env.SIGNED }}`(yes = 用固定密钥签名,可以直接覆盖安装,数据保留)

            如果这里显示 no,说明仓库缺少 KEYSTORE_BASE64 这个 Secret,
            装之前请先在应用里导出数据备份。

            ---

            **从网页壳版本(包名 app.ledger)升上来的话,要先卸载旧的那个。**
            原生版的包名是 `app.calorease`,安卓会把它当成另一个应用,
            装上去不会覆盖旧版,而是两个图标并存。
          files: out/calorease.apk

      - name: Also keep it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: calorease-apk
          path: out/calorease.apk
